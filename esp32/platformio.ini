; SmartAlarm — compilation locale du firmware ESP32 avec PlatformIO.
; Le firmware produit (.pio/build/esp32dev/) est lancé dans le simulateur
; Wokwi de VS Code via wokwi.toml.

[platformio]
src_dir = .                  ; le sketch reste à la racine de esp32/

[env:esp32dev]
platform = espressif32@7.1.1
board = esp32doit-devkit-v1  ; ESP32 DevKit V1
framework = arduino
build_src_filter = +<*.ino> +<*.ino.cpp> -<.pio/>
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
